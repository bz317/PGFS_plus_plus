# =============================================================================
# PGFS++ conda environment
# =============================================================================
#
# Location:
#   <repo-root>/conda_env_pgfspp.yml
#
# Recommended install (GPU / CUDA 12.1):
#
#   cd <repo-root>
#   conda env create -f conda_env_pgfspp.yml
#   conda activate pgfspp
#   bash scripts/bootstrap_pgfspp_cuda121.sh
#   pip install -e .
#
# The bootstrap step installs PyTorch and PyTorch Geometric wheels from the
# cu121/PyG indices; they are not reliably resolved from plain PyPI during
# `conda env create`.
#
# Quick sanity check after install:
#
#   conda activate pgfspp
#   PYTHONPATH=. python -m compileall -q src tools visualization
#   python -c "import torch, rdkit, wandb; print('ok', torch.__version__)"
#
# Update an existing environment:
#
#   conda activate pgfspp
#   conda env update -n pgfspp -f conda_env_pgfspp.yml --prune
#   bash scripts/bootstrap_pgfspp_cuda121.sh
#
# =============================================================================

name: pgfspp

channels:
  - conda-forge
  - defaults

dependencies:
  - python=3.10.20
  - pip>=24.0

  - rdkit=2023.9.6

  - numpy=1.24.4
  - scipy=1.10.1
  - pandas=2.3.3
  - scikit-learn=1.3.2
  - networkx=3.1

  - matplotlib=3.7.5
  - pillow=12.2.0

  - pip:
      - wandb==0.25.1
      - PyYAML==6.0.1
      - tqdm==4.67.3

      # PyTorch + PyG: installed by scripts/bootstrap_pgfspp_cuda121.sh
      # - torch==2.3.0+cu121
      # - torchvision==0.18.0+cu121
      # - torch-geometric==2.7.0
      # - torch-scatter==2.1.2+pt23cu121
      # - torch-sparse==0.6.18+pt23cu121
      # - torch-cluster==1.6.3+pt23cu121
      # - torch-spline-conv==1.2.2+pt23cu121
